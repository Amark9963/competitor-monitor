name: Competitor monitor

on:
  schedule:
    - cron: "0 13 * * 1-5"   # weekdays 13:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # The SQLite state file must survive between runs so we can diff against it.
      - name: Restore monitor state
        uses: actions/cache/restore@v4
        with:
          path: data/monitor.db
          key: monitor-db-${{ github.run_id }}
          restore-keys: monitor-db-

      - name: Run monitor
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python -m competitor_monitor run

      - name: Save monitor state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/monitor.db
          key: monitor-db-${{ github.run_id }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: competitor-report-${{ github.run_id }}
          path: reports/
